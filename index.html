<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10264f">
<title>Leonidas | Catalogue 2027</title>
<style>
:root{--navy:#10264f;--gold:#c5a46d;--cream:#f7f4ed}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#17233b;font-family:Arial,sans-serif}
header{background:var(--navy);color:white;text-align:center;padding:22px 12px 18px;border-bottom:4px solid var(--gold)}
.brand{font-family:Georgia,serif;font-size:clamp(27px,5vw,42px);letter-spacing:3px}
.sub{font-size:11px;letter-spacing:2px;color:#e5d4b2;margin-top:6px}
main{max-width:1000px;margin:22px auto;padding:0 14px}
.toolbar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0 18px}
button{background:var(--navy);color:white;border:0;border-radius:4px;padding:11px 18px;font-size:15px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
#counter{font-size:14px;color:#5c6472;min-width:90px;text-align:center}
.viewer{min-height:55vh;display:flex;justify-content:center;align-items:flex-start}
canvas{max-width:100%;height:auto!important;box-shadow:0 8px 30px #17233b20;background:white}
.status{text-align:center;color:#697080;font-size:13px;margin:12px}
footer{text-align:center;color:#7a7a7a;font-size:12px;padding:20px}
@media(max-width:600px){main{margin:12px auto}.viewer{min-height:40vh}button{padding:10px 13px}}
</style>
</head>
<body>
<header><div class="brand">LEONIDAS TANGER</div><div class="sub">MAÎTRE CHOCOLATIER · DEPUIS 1913</div></header>
<main>
  <h1 style="text-align:center;font:30px Georgia,serif;color:#10264f;margin:22px 0 6px">Catalogue 2027</h1>
  <div class="toolbar">
    <button id="prev" disabled>‹ Précédent</button>
    <span id="counter">Page 1</span>
    <button id="next" disabled>Suivant ›</button>
  </div>
  <div class="viewer"><canvas id="page"></canvas></div>
  <div class="status" id="status">Chargement du catalogue…</div>
  <div class="toolbar">
    <button id="open" type="button">Ouvrir le PDF complet</button>
  </div>
</main>
<footer>Leonidas Tanger · Catalogue 2027</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdf=null, pageNum=1, rendering=false, queued=null;
const canvas=document.getElementById('page'), ctx=canvas.getContext('2d');
const status=document.getElementById('status'), counter=document.getElementById('counter');
const prev=document.getElementById('prev'), next=document.getElementById('next');
function controls(){counter.textContent=`Page ${pageNum} / ${pdf.numPages}`;prev.disabled=pageNum<=1;next.disabled=pageNum>=pdf.numPages;}
async function renderPage(n){
 if(rendering){queued=n;return} rendering=true;
 try{
  const page=await pdf.getPage(n);
  const base=page.getViewport({scale:1});
  const width=Math.min(window.innerWidth-28,920);
  const scale=width/base.width;
  const viewport=page.getViewport({scale});
  canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);
  await page.render({canvasContext:ctx,viewport}).promise;
  pageNum=n;controls();status.textContent=''; 
 }catch(e){status.textContent='Impossible d’afficher cette page. Ouvrez le PDF complet.'}
 rendering=false;if(queued!==null){const q=queued;queued=null;renderPage(q)}
}
pdfjsLib.getDocument({url:'catalogue.pdf',rangeChunkSize:65536,disableAutoFetch:true,disableStream:false}).promise.then(async doc=>{
 pdf=doc;controls();document.getElementById('open').onclick=()=>window.open('catalogue.pdf','_blank');
 await renderPage(1);
}).catch(()=>{status.textContent='Le catalogue ne peut pas être chargé. Vérifiez que catalogue.pdf est bien présent.'});
prev.onclick=()=>{if(pdf&&pageNum>1)renderPage(pageNum-1)};
next.onclick=()=>{if(pdf&&pageNum<pdf.numPages)renderPage(pageNum+1)};
window.addEventListener('resize',()=>{if(pdf)renderPage(pageNum)});
</script>
</body></html>
